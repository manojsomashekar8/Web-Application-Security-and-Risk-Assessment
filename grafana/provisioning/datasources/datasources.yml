apiVersion: 1
datasources:
  - name: Prometheus
    uid: prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: WASRA DB (read-only)
    uid: wasra-db
    type: postgres
    access: proxy
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: wasra
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
