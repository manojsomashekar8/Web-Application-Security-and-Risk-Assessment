server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths return index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON API lives in the backend. Authorization and WWW-Authenticate pass through unchanged,
    # so the browser's Basic-auth login is checked by the backend, not by nginx.
    # Resolve the backend per request (not at startup): nginx would refuse to start if the backend
    # container is not up yet, which happens when the stack starts in parallel (reproduce attempt 7).
    resolver 127.0.0.11 valid=10s;
    location /api/ {
        set $backend_url http://backend:8000;
        proxy_pass $backend_url;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
