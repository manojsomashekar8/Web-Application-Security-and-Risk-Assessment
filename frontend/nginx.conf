server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths return index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON API lives in the backend. Authorization and WWW-Authenticate pass through unchanged,
    # so the browser's Basic-auth login is checked by the backend, not by nginx.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
